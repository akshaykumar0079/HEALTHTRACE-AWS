# MedGuard configuration (SPEC.md section 6.2 and 6.6).
# Only the values needed by Milestone 1 (generator + service metadata) are
# used today; the rest of the sections below are the literal constants the
# spec calls out for the baseline/anomaly/severity/incident engines built in
# later milestones, recorded here now so those milestones don't invent new
# numbers that drift from the spec.

# label/depends_on are display metadata for the dashboard's service map:
# depends_on declares which services call which (e.g. prior_auth's
# "Downstream eligibility check failed" errors). Detection ignores them.
services:
  prior_auth:
    criticality: 1.0
    label: Prior Authorization
    depends_on: [eligibility]
  eligibility:
    criticality: 0.9
    label: Eligibility
    depends_on: []
  pharmacy:
    criticality: 0.8
    label: Pharmacy
    depends_on: [eligibility]
  claims:
    criticality: 0.6
    label: Claims
    depends_on: [eligibility]
  batch:
    criticality: 0.3
    label: Batch Jobs
    depends_on: [claims]

priority_weight:
  urgent: 2
  routine: 1

baseline:
  # Tuned down from the spec's literal 0.1 (documented in README under
  # "Design decisions"): at 0.1 the baseline adapts fast enough to chase a
  # gradual ramp (a sustained ~4-5x rate shift diluted by the 60s window)
  # before its z-score ever crosses the anomaly threshold, so it's never
  # caught. 0.05 keeps the baseline "stickier" against exactly this kind of
  # slow poisoning while still reacting normally to sudden step changes
  # (those trip the threshold on their very first window regardless of alpha).
  alpha: 0.05
  warmup_windows: 12

anomaly:
  min_std: 0.01
  error_rate_z_threshold: 3.0
  error_rate_min_errors: 5
  error_rate_min_rate: 0.05
  latency_z_threshold: 4.0
  # Separate from min_std above (documented in README under "Design
  # decisions"): min_std=0.01 is a sensible 1% floor for error_rate (a 0-1
  # fraction), but applied to p95_latency_ms (measured in tens-to-thousands
  # of milliseconds) it's a units mismatch — 0.01ms is negligible, so any
  # tiny natural fluctuation in a large-sample p95 estimate produces a huge
  # z-score. Found by running the anomaly engine against 10 seeds of pure
  # normal traffic (29 false positives at 0.01ms; 0 at every value from
  # 5ms up); 20ms keeps a comfortable margin while a real 5x latency spike
  # still fires with z in the hundreds, nowhere near this floor.
  latency_min_std_ms: 20.0

severity:
  deviation_z_cap: 6
  # Tuned up from the spec's literal 40 (documented in README under "Design
  # decisions"): at the generator's own suggested rate (20-50 events/sec
  # across services) a 60s window naturally accumulates hundreds of events
  # per service, so any sustained elevated error rate saturates a 40-patient
  # cap immediately regardless of actual severity, collapsing the
  # patient-impact term to a constant 1.0. 400 keeps it meaningful across
  # that realistic volume while a truly massive spike (urgent_prior_auth_
  # failure, eligibility_outage) still saturates it.
  patient_factor_cap: 400
  criticality_weight: 0.5
  patient_factor_weight: 0.5
  thresholds:
    low_max: 0.30
    medium_max: 0.50
    high_max: 0.75

hipaa:
  bulk_multiplier_high: 3
  bulk_multiplier_critical: 6
  # Tuned up from the spec's literal 50 (documented in README under "Design
  # decisions"): at the generator's own suggested rate, ~30 users sharing
  # ~7 audit events/sec produce roughly 130 distinct-patient touches per
  # user per 10-minute window under entirely normal traffic, so a floor of
  # 50 flags nearly every ordinary user as CRITICAL "bulk access" within
  # the first 10 minutes of any session (found by actually running the
  # backend against generated traffic, not just unit tests). 200 sits
  # comfortably above that normal range while still well below the demo's
  # bulk_phi_access scenario (300 patients), which still reliably fires.
  bulk_min_threshold: 200
  # A separate, much smaller floor than bulk_min_threshold: EXPORT_RECORDS
  # is only ~2% of audit actions (~2.8 exports/user/10min under normal
  # traffic, verified directly), so reusing the 200 bulk-access floor here
  # would make the MEDIUM export tier (below export_critical_records)
  # unreachable in practice.
  export_min_threshold: 20
  export_critical_records: 100
  off_hours_start: "07:00"
  off_hours_end: "21:00"
  off_hours_high_records: 20
  region_mismatch_medium_max: 5
  # Business hours above are judged in this zone. Previously they were
  # judged in UTC while the generator produced staff traffic around the
  # clock, so for 10 hours a day every ordinary user's every access fired a
  # HIGH off-hours alert (~90 alerts/sec, 30 permanently-open incidents).
  # The generator reads this same value and only emits ordinary staff
  # traffic inside these hours. Tennessee regions -> America/Chicago; change
  # it (e.g. Asia/Kolkata) to have background staff traffic during your own
  # daytime demos.
  timezone: America/Chicago
  # An unchanged HIPAA pattern for the same user re-alerts at most once per
  # this many seconds of event time; a severity escalation alerts at once.
  realert_seconds: 60

incident:
  cooldown_minutes: 5
  service_auto_resolve_windows: 6
  hipaa_auto_resolve_minutes: 10
  # A recurrence of the same fingerprint within this many minutes after
  # resolution reopens the incident (one problem, one incident). Later
  # recurrences open a new incident. 0 disables reopening.
  reopen_window_minutes: 3

# Failed logins followed by a successful one (auth.log).
auth:
  failure_threshold: 5
  window_minutes: 10
  high_failure_multiple: 2
  realert_seconds: 60

window:
  size_seconds: 60
  step_seconds: 5

